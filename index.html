<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КЛЁВ — рыболовный навигатор</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
<section class="hero">
<h1>КЛЁВ</h1>
<p>Куда едем на рыбалку? Найди место, посмотри отчёты и строй маршрут.</p>
</section>
<section class="controls">
<label>Рыба<select id="fish"><option value="all">Любая</option><option>Щука</option><option>Судак</option><option>Окунь</option><option>Карп</option></select></label>
<label>Расстояние<select id="distance"><option value="all">Любое</option><option value="30">до 30 км</option><option value="70">до 70 км</option><option value="150">до 150 км</option></select></label>
<label>Поиск<input id="search" placeholder="водоём или район"></label>
</section>
<div class="grid">
<section class="places"><h2>Места для рыбалки</h2><div id="list"></div></section>
<section><div id="map"></div><p class="meta">Демо-точки. Позже подключим реальные отчёты и источники.</p></section>
</div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
